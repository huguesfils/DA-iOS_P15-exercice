name: iOS Build and Test

# Déclenche le pipeline à chaque ouverture/mise à jour d'une pull request ciblant main.
# Objectif : garantir qu'un code mergé sur main compile et passe les tests unitaires.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest

    steps:
      # 1. Récupère le code source du repository pour le rendre accessible aux étapes suivantes.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Compile l'application et exécute les tests unitaires sur un simulateur iOS.
      #    L'action génère un bundle de résultats (.xcresult) consommé à l'étape suivante.
      - name: Build and Test
        uses: sersoft-gmbh/xcodebuild-action@v3.2.0
        with:
          project: EPCollaboratif.xcodeproj
          scheme: EPCollaboratif
          destination: 'platform=iOS Simulator,name=iPhone 16'
          action: test
          result-bundle-path: 'TestResults/TestResults.xcresult'

      # 3. Conserve le bundle de résultats (.xcresult) comme artefact téléchargeable,
      #    que les tests réussissent OU échouent, pour analyse a posteriori dans Xcode.
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults/TestResults.xcresult
        if: success() || failure()
