name: iOS Build and Test

# Déclenche le pipeline à chaque ouverture/mise à jour d'une pull request ciblant main.
# Objectif : garantir qu'un code mergé sur main compile et passe les tests unitaires.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest

    env:
      RESULT_BUNDLE: TestResults/TestResults.xcresult

    steps:
      # 1. Récupère le code source du repository pour le rendre accessible aux étapes suivantes.
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Repart d'un cache de build propre pour éviter les faux positifs hérités d'un run précédent.
      - name: Clean DerivedData
        run: rm -rf ~/Library/Developer/Xcode/DerivedData

      # 3. Compile l'application et exécute les tests unitaires sur un simulateur iOS.
      #    Appel direct à xcodebuild (plus d'action tierce) pour maîtriser l'emplacement
      #    exact du bundle de résultats et supprimer la dépendance au runtime Node déprécié.
      #    La signature de code est désactivée (inutile pour des tests unitaires en CI).
      #    set -o pipefail garantit que l'échec de xcodebuild fait échouer l'étape
      #    même quand la sortie est passée à xcbeautify.
      - name: Build and Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project EPCollaboratif.xcodeproj \
            -scheme EPCollaboratif \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath DerivedData \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | xcbeautify

      # 4. Génère un résumé lisible des tests dans l'onglet Summary du job,
      #    via l'outil natif xcresulttool (livré avec Xcode, aucune action tierce non maintenue).
      - name: Test summary
        if: success() || failure()
        run: |
          {
            echo "## Résultats des tests"
            echo '```'
            xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 5. Compresse le bundle .xcresult avec ditto pour préserver son intégrité
      #    (symlinks internes) avant l'upload, puis l'archive comme artefact téléchargeable,
      #    que les tests réussissent OU échouent, pour analyse a posteriori dans Xcode.
      - name: Compress test results
        if: success() || failure()
        run: ditto -c -k --keepParent "$RESULT_BUNDLE" TestResults.xcresult.zip

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v5
        with:
          name: TestResults
          path: TestResults.xcresult.zip
          if-no-files-found: error
